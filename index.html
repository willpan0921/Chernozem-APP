<!doctype html>
<!--
  WHAT THIS FILE DOES
  The single web page the browser opens. It is almost empty on purpose: the
  app draws itself inside the "root" box below, starting from src/main.jsx.

  WHO EDITS IT
  Nobody, normally. Edit it only to change the browser tab title or the
  fonts loaded from Google Fonts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chernozem</title>
    <!-- The logo in the browser tab and on phone home screens (public/). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The two fonts: Inter for text and JetBrains Mono for numbers. They
         are named in src/styles/tokens.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
