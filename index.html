<!doctype html>
<!--
  WHAT THIS FILE DOES
  The single web page the browser opens. It is almost empty on purpose: the
  app draws itself inside the "root" box below, starting from src/main.jsx.

  WHO EDITS IT
  Nobody, normally. Edit it only to change the browser tab title.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chernozem Field</title>
    <!-- Loads Caveat, the handwritten font, from Google Fonts. The fonts are
         listed in src/styles.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
